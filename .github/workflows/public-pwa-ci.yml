name: public-pwa-ci

on:
  pull_request:
    paths:
      - 'index.html'
      - 'public-status.json'
      - 'sw.js'
      - 'manifest.webmanifest'
      - '.github/workflows/public-pwa-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-public-pwa:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate public status contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path('public-status.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          assert data['repository_evidence'] == {
              'latest_proof': 'GP014A',
              'result': 'PASS',
              'authority': 'REPOSITORY_EVIDENCE',
          }
          assert data['working_context']['latest_proof'] == 'GP014A'
          assert data['working_context']['result'] == 'PASS'
          assert data['working_context']['authority'] == 'WORKING_CONTEXT_RECONCILED'
          assert data['working_context']['reconciled'] is True
          assert data['sync_state'] == 'SYNCED_OR_REPOSITORY_AHEAD'
          assert data['next_action'] == 'GP014B_PENDING_SEPARATE_AUTHORIZATION'
          assert data['safety']['fail_closed'] is True
          assert data['safety']['real_money'] == 'PROHIBITED'
          assert data['safety']['live_trade_control'] == 'NOT_PRESENT_IN_COMMAND_CENTER'
          assert data['safety']['canonical_frozen_auto_edit'] == 'BLOCKED'
          print('public status contract valid')
          PY

      - name: Validate visible release and safety text
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8')
          required = [
              'ORZ COMMAND CENTER v0.4.3',
              'Public v0.4.3',
              'GP014A / PASS',
              'GP014A / PASS（照合済み）',
              'SYNCED',
              'GP014B / PENDING',
              'リアルマネー</span><span class="pill red">禁止',
              'Canonical / Frozen 自動変更</span><span class="pill red">禁止',
          ]
          for item in required:
              assert item in html, item
          forbidden = [
              'GP013A / PASS',
              'GAP_DETECTED',
              'PASS（未照合',
          ]
          for item in forbidden:
              assert item not in html, item
          print('visible public contract valid')
          PY

      - name: Validate service worker freshness policy
        run: |
          python - <<'PY'
          from pathlib import Path
          sw = Path('sw.js').read_text(encoding='utf-8')
          assert "orz-command-v0.4.3" in sw
          assert "public-status.json" not in sw.split('const ASSETS=',1)[1].split(';',1)[0]
          assert "cache:'no-store'" in sw
          print('service worker freshness policy valid')
          PY

# Validation only. No deployment or repository write is performed.
