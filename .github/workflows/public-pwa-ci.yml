name: public-pwa-ci

on:
  pull_request:
    paths:
      - 'index.html'
      - 'styles.css'
      - 'app.js'
      - 'public-status.json'
      - 'sw.js'
      - 'manifest.webmanifest'
      - 'README.md'
      - 'README_PUBLIC.md'
      - '.github/workflows/public-pwa-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-public-pwa:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate public status fail-closed contract
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path

          data=json.loads(Path('public-status.json').read_text(encoding='utf-8'))
          assert data['schema_version']=='public-0.2'
          assert data['release_channel']=='v0.5.0-rc1'
          assert data['source']['repository']=='poketaro1930katsu-sys/orz-ea-development'
          assert re.fullmatch(r'[0-9a-f]{40}',data['source']['main_sha'])
          assert data['canonical']['version']=='0.3.1'
          assert re.fullmatch(r'[0-9A-F]{64}',data['canonical']['source_sha256'])
          assert data['strategy_track']['last_formal_proof']=='GP014A'
          assert data['strategy_track']['last_formal_result']=='PASS'
          assert data['strategy_track']['next_gate']=='GP014B'
          assert data['strategy_track']['runtime_authorized'] is False
          assert data['implementation_gate']['source_implementation_authorized'] is False
          assert data['implementation_gate']['next_version_label']=='UNRESOLVED_DO_NOT_INFER'
          assert data['performance']['published'] is False
          assert data['performance']['status']=='UNVERIFIED_NOT_PUBLISHED'
          assert data['safety']['fail_closed'] is True
          assert data['safety']['real_money']=='PROHIBITED'
          assert data['safety']['live_trade_control']=='NOT_PRESENT_IN_COMMAND_CENTER'
          assert data['safety']['canonical_frozen_auto_edit']=='BLOCKED'
          assert data['safety']['command_center_trade_api']=='NONE'
          assert data['safety']['private_evidence_exposed'] is False
          assert data['safety']['credentials_exposed'] is False
          print('public status contract valid')
          PY

      - name: Validate five functional app sections
        run: |
          python - <<'PY'
          from pathlib import Path
          html=Path('index.html').read_text(encoding='utf-8')
          js=Path('app.js').read_text(encoding='utf-8')
          css=Path('styles.css').read_text(encoding='utf-8')
          status=Path('public-status.json').read_text(encoding='utf-8')
          for tab in ['command','strategy','evidence','performance','ai']:
              assert f'data-tab="{tab}"' in html, tab
              assert f'data-view="{tab}"' in html, tab
          for required in [
              'ORZ COMMAND CENTER v0.5.0',
              'public-status.json',
              'FAIL-CLOSED',
              'リアルマネー',
              'KOMEI READ-ONLY NAVIGATOR',
              'UNVERIFIED'
          ]:
              assert required in (html+js+status), required
          assert "VALID_TABS" in js
          assert "validateStatus" in js
          assert "enterFailClosed" in js
          assert "cache:'no-store'" in js
          assert ":focus-visible" in css
          assert "prefers-reduced-motion" in css
          print('app sections and safety UI valid')
          PY

      - name: Validate service worker freshness policy
        run: |
          python - <<'PY'
          from pathlib import Path
          sw=Path('sw.js').read_text(encoding='utf-8')
          assert "orz-command-v0.5.0" in sw
          assets=sw.split('const ASSETS=',1)[1].split(';',1)[0]
          assert 'public-status.json' not in assets
          assert "url.pathname.endsWith('/public-status.json')" in sw
          assert "cache:'no-store'" in sw
          assert 'caches.match(req)' in sw
          print('service worker freshness policy valid')
          PY

      - name: Validate manifest and release consistency
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path('manifest.webmanifest').read_text(encoding='utf-8'))
          html=Path('index.html').read_text(encoding='utf-8')
          readme=Path('README_PUBLIC.md').read_text(encoding='utf-8')
          assert manifest['display']=='standalone'
          assert manifest['start_url']=='./index.html#command'
          assert 'v0.5.0' in html
          assert 'v0.5.0-rc1' in readme
          assert 'Production deployment is a separate human decision.' in readme
          print('manifest and release consistency valid')
          PY

# Validation only. No deployment, merge, repository secret, or runtime/trading operation is performed.
